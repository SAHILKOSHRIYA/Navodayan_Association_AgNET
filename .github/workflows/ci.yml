# Continuous integration: build and test both apps on every push and pull request.
# A red build here should block merges to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (.NET 9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Restore
        run: dotnet restore server/NAU.sln
      - name: Build
        run: dotnet build server/NAU.sln --configuration Release --no-restore
      - name: Unit tests
        run: dotnet test server/tests/NAU.UnitTests/NAU.UnitTests.csproj --configuration Release --no-build --verbosity normal

  integration:
    name: Integration tests (real PostgreSQL)
    runs-on: ubuntu-latest       # GitHub Linux runners include Docker, which Testcontainers needs
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Integration tests
        run: dotnet test server/tests/NAU.IntegrationTests/NAU.IntegrationTests.csproj --configuration Release

  frontend:
    name: Frontend (Angular 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install
        run: npm ci
        working-directory: client
      - name: Production build
        run: npm run build
        working-directory: client

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image (no push)
        run: docker build -t nau-app:ci .
